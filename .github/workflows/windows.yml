name: Windows application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt pyinstaller==6.16.0 playwright==1.56.0
      - run: python -m pytest -q
      - name: Build standalone application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --name OzonProfit
          --collect-all streamlit --collect-all plotly --collect-all pandas
          --collect-all openpyxl --collect-all ozon_profit --collect-all truststore
          --copy-metadata streamlit --add-data "app.py;."
          --add-data ".streamlit/config.toml;.streamlit" launcher.py
      - run: python -m playwright install chromium --only-shell
      - name: Test packaged Windows app in a browser
        run: python scripts/smoke_packaged.py
      - name: Prepare Windows archive
        shell: pwsh
        run: |
          Copy-Item WINDOWS.txt dist/OzonProfit/ПРОЧИТАЙТЕ.txt
          Set-Content -Path dist/OzonProfit/version.txt -Value '${{ github.ref_name }} / ${{ github.sha }}'
          Compress-Archive -Path dist/OzonProfit -DestinationPath dist/OzonProfit-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OzonProfit-Windows
          path: dist/OzonProfit-Windows.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-evidence
          path: windows-smoke.png
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OzonProfit-Windows
          path: release
      - name: Publish tested Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release/OzonProfit-Windows.zip
          --title "Ozon Profit $RELEASE_TAG" --prerelease
          --notes "Windows 10/11. Extract the complete ZIP and open OzonProfit.exe. Includes the dashboard, persistent local costs and credentials, and sales planning. Tested with synthetic data; financial estimates remain provisional."
