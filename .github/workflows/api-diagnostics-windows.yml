name: Windows API diagnostics

on:
  workflow_dispatch:
  push:
    branches: ['diagnostics/api-capabilities']
    paths:
      - 'diagnose_api.py'
      - 'ozon_profit/api_diagnostics.py'
      - 'tests/test_api_diagnostics.py'
      - 'scripts/smoke_diagnostics_windows.py'
      - 'scripts/summarize_diagnostic_tests.py'
      - '.github/workflows/api-diagnostics-windows.yml'
      - 'API_DIAGNOSTICS.md'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate dependencies from preinstalled runner packages
        shell: pwsh
        run: |
          python -m venv .diagnostic-venv
          "$env:GITHUB_WORKSPACE\.diagnostic-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements-dev.txt pyinstaller==6.16.0
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=diagnostic-tests.xml
      - name: Record test results and failure details
        if: always()
        run: python scripts/summarize_diagnostic_tests.py
      - name: Build standalone diagnostic (no application update)
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name OzonApiDiagnostics --collect-all truststore diagnose_api.py
      - name: Verify packaged EXE with real Windows DPAPI and an unchanged database
        run: python scripts/smoke_diagnostics_windows.py
      - name: Package diagnostic only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/diagnostics | Out-Null
          Copy-Item dist/OzonApiDiagnostics.exe dist/diagnostics/
          Copy-Item API_DIAGNOSTICS.md dist/diagnostics/READ-ME.md
          Set-Content -Path dist/diagnostics/source-commit.txt -Value '${{ github.sha }}'
          Get-FileHash dist/diagnostics/OzonApiDiagnostics.exe -Algorithm SHA256 | Format-List | Out-File dist/diagnostics/SHA256.txt
          Compress-Archive -Path dist/diagnostics/* -DestinationPath dist/OzonApiDiagnostics-Windows.zip
          [xml]$results = Get-Content diagnostic-tests.xml
          $suite = $results.testsuites.testsuite
          "Tests: $($suite.tests); failures: $($suite.failures); errors: $($suite.errors); skipped: $($suite.skipped)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Packaged EXE smoke passed: real DPAPI, unchanged database and credentials, safe offline JSON." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: OzonApiDiagnostics-Windows
          path: dist/OzonApiDiagnostics-Windows.zip
          retention-days: 30
  publish-v2:
    needs: diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OzonApiDiagnostics-Windows
          path: release
      - name: Verify archive and source before publication
        shell: python
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          import hashlib, os, re, zipfile
          from pathlib import Path
          path = Path('release/OzonApiDiagnostics-Windows.zip')
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert archive.read('source-commit.txt').decode('utf-8-sig').strip() == os.environ['BUILD_SHA']
              executable = archive.read('OzonApiDiagnostics.exe')
              assert executable.startswith(b'MZ')
              digest = hashlib.sha256(executable).hexdigest()
              assert re.search(digest, archive.read('SHA256.txt').decode('utf-8-sig'), re.I)
          Path(str(path) + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n', encoding='ascii')
      - name: Prepare release notes
        shell: bash
        run: |
          cat > release/notes.md <<'NOTES'
          Диагностика API v2 для Windows: сохранённые ключи, база только для чтения, без импорта и финансовых расчётов. Python не нужен.
          Добавлены безопасная диагностика полей кампаний Performance, пробы статистики при неизвестном типе оплаты и ограниченные повторы HTTP 429 с учётом Retry-After. Неизвестный тип оплаты не считается CPC. Суммы и конверсии не вычисляются; ключи, токены, содержимое заказов и финансовых операций в JSON не выгружаются.
          Скачайте ZIP, распакуйте и запустите EXE под прежней учётной записью Windows. Выберите новое имя JSON и дождитесь завершения. Основное приложение не обновляется.
          Публикация выполняется только после тестов, сборки Windows EXE и проверки настоящего DPAPI, безопасного JSON и неизменности тестовой базы/ключей.
          NOTES
      - name: Publish Windows diagnostic v2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create api-diagnostics-v2-2026-11-10
          release/OzonApiDiagnostics-Windows.zip
          release/OzonApiDiagnostics-Windows.zip.sha256
          --target '${{ github.sha }}'
          --title 'Диагностика API v2 для Windows — 10.11.2026'
          --prerelease --notes-file release/notes.md
