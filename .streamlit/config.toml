[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 25
enableStaticServing = true

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#0956ff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#141414"
font = "sans serif"
